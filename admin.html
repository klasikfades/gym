<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Staff Dashboard | Gym</title>
  <meta name="description" content="Staff and admin dashboard for gym memberships, payments and check-ins." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* ---------- app shell ---------- */
    [hidden] { display: none !important; }
    body.admin { background: var(--surface-alt); }
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .login-card { width: 100%; max-width: 380px; }
    .login-card h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .pin-input { letter-spacing: .3em; font-size: 1.2rem; text-align: center; }

    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: 236px; flex: 0 0 236px; background: var(--surface);
      border-right: 1px solid var(--line); padding: 18px 12px;
      display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh;
      overflow-y: auto;
    }
    .sidebar .brand { margin: 0 6px 14px; }
    .nav-btn {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 11px 12px; border: 0; border-radius: 10px; background: transparent;
      color: var(--muted); font: inherit; font-weight: 600; text-align: left; cursor: pointer;
    }
    .nav-btn:hover { background: var(--surface-alt); color: var(--text); }
    .nav-btn[aria-current="page"] { background: color-mix(in srgb, var(--brand) 14%, transparent); color: var(--brand-strong); }
    .nav-icon { width: 20px; text-align: center; font-size: 1rem; }
    .sidebar-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--line); }

    .app-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      display: flex; align-items: center; gap: 10px; padding: 10px 18px;
      background: var(--surface); border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 20;
    }
    .topbar h2 { margin: 0; font-size: 1.05rem; }
    .topbar-spacer { margin-left: auto; }
    .icon-btn {
      min-width: 40px; min-height: 40px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--surface); color: var(--text); font: inherit; cursor: pointer;
    }
    .icon-btn:hover { background: var(--surface-alt); }
    .view { padding: 20px 18px 96px; }
    .view-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
    .view-head h1 { font-size: 1.5rem; margin: 0; }
    .view-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

    /* ---------- cards / kpi ---------- */
    .kpi-grid { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
    .kpi-label { font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 6px; }
    .kpi-value { font-size: 1.7rem; font-weight: 700; letter-spacing: -.03em; margin: 0; }
    .kpi-value.warn { color: #b45309; }
    .kpi-value.bad { color: var(--danger); }
    .kpi-value.good { color: var(--ok); }

    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-top: 16px; }
    .panel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .charts { display: grid; gap: 14px; grid-template-columns: 1fr; }
    .chart-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
    .chart-box h3 { font-size: .9rem; color: var(--muted); margin: 0 0 10px; text-transform: uppercase; letter-spacing: .06em; }
    .chart-holder { position: relative; height: 220px; }

    /* ---------- tables / lists ---------- */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    .badge {
      display: inline-block; padding: 3px 9px; border-radius: 999px;
      font-size: .74rem; font-weight: 700; letter-spacing: .02em; white-space: nowrap;
      background: var(--surface-alt); color: var(--muted); border: 1px solid var(--line);
    }
    .badge.active { background: #dcfce7; color: #14532d; border-color: #bbf7d0; }
    .badge.expiring { background: #fef3c7; color: #7c2d12; border-color: #fde68a; }
    .badge.expired { background: #fee2e2; color: #7f1d1d; border-color: #fecaca; }
    .badge.frozen { background: #dbeafe; color: #1e3a8a; border-color: #bfdbfe; }
    .badge.notstarted { background: #ede9fe; color: #4c1d95; border-color: #ddd6fe; }
    html[data-theme="dark"] .badge.active { background: #052e21; color: #6ee7b7; border-color: #065f46; }
    html[data-theme="dark"] .badge.expiring { background: #3b2a05; color: #fcd34d; border-color: #78350f; }
    html[data-theme="dark"] .badge.expired { background: #3f1211; color: #fca5a5; border-color: #7f1d1d; }
    html[data-theme="dark"] .badge.frozen { background: #10233f; color: #93c5fd; border-color: #1e40af; }
    html[data-theme="dark"] .badge.notstarted { background: #1f1636; color: #c4b5fd; border-color: #4c1d95; }

    .cards-list { display: grid; gap: 10px; }
    .member-card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px; display: grid; gap: 6px;
    }
    .member-card-top { display: flex; align-items: flex-start; gap: 8px; }
    .member-card-top strong { font-size: 1rem; }
    .member-card-top .badge { margin-left: auto; }
    .member-meta { color: var(--muted); font-size: .85rem; display: flex; flex-wrap: wrap; gap: 4px 12px; }

    .empty {
      text-align: center; padding: 34px 16px; color: var(--muted);
      border: 1px dashed var(--line); border-radius: var(--radius); background: var(--surface);
    }
    .empty strong { display: block; color: var(--text); margin-bottom: 4px; }

    .skel { height: 54px; border-radius: 10px; margin-bottom: 8px;
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface-alt) 37%, var(--surface) 63%);
      background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }

    /* ---------- forms ---------- */
    .form-grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
    .field label { font-size: .85rem; }
    .field .hint { color: var(--muted); font-size: .78rem; margin: 4px 0 0; }
    .inline-fields { display: flex; gap: 10px; flex-wrap: wrap; }
    .inline-fields > .field { flex: 1 1 160px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .toolbar input[type="search"] { flex: 1 1 200px; }
    select { min-height: 44px; }

    /* ---------- modal ---------- */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(8, 15, 26, .58);
      display: grid; place-items: end center; z-index: 60; padding: 0;
    }
    .modal {
      background: var(--surface); width: 100%; max-width: 640px; max-height: 92vh;
      overflow-y: auto; border-radius: 18px 18px 0 0; padding: 20px;
      box-shadow: 0 -10px 40px rgba(0,0,0,.3);
    }
    .modal-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
    .modal-head h2 { margin: 0; font-size: 1.15rem; }
    .modal-head .icon-btn { margin-left: auto; }
    .modal-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
    .detail-grid { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
    .detail-grid div span { display: block; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .detail-grid div strong { font-weight: 600; }
    .section-title { margin: 20px 0 8px; font-size: .82rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }

    /* ---------- toast ---------- */
    #toast-root { position: fixed; left: 50%; transform: translateX(-50%); bottom: 88px; z-index: 80; display: grid; gap: 8px; width: min(420px, 92vw); }
    .toast {
      padding: 12px 14px; border-radius: 12px; font-weight: 600; font-size: .9rem;
      background: #0f172a; color: #f8fafc; box-shadow: 0 10px 30px rgba(0,0,0,.25);
      animation: toastIn .18s ease;
    }
    .toast.error { background: #7f1d1d; }
    .toast.ok { background: #064e3b; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* ---------- check-in ---------- */
    .checkin-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
    .checkin-input { font-size: 1.25rem; min-height: 60px; }
    .checkin-result { margin-top: 14px; border-radius: var(--radius); padding: 16px; border: 1px solid var(--line); }
    .checkin-result.allowed { background: #ecfdf5; border-color: #a7f3d0; }
    .checkin-result.warned { background: #fffbeb; border-color: #fde68a; }
    .checkin-result.blocked { background: #fef2f2; border-color: #fecaca; }
    .checkin-result.duplicate { background: #eff6ff; border-color: #bfdbfe; }
    html[data-theme="dark"] .checkin-result.allowed { background: #052e21; border-color: #065f46; }
    html[data-theme="dark"] .checkin-result.warned { background: #3b2a05; border-color: #78350f; }
    html[data-theme="dark"] .checkin-result.blocked { background: #3f1211; border-color: #7f1d1d; }
    html[data-theme="dark"] .checkin-result.duplicate { background: #10233f; border-color: #1e40af; }
    .checkin-result h3 { margin: 0 0 4px; }

    /* ---------- print ---------- */
    .receipt { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: .9rem; }
    .receipt h3 { text-align: center; font-family: inherit; }
    .receipt-line { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
    .receipt hr { border: 0; border-top: 1px dashed var(--line); margin: 10px 0; }

    @media print {
      .sidebar, .topbar, .view-actions, .modal-foot, #toast-root, .no-print { display: none !important; }
      body.admin { background: #fff; }
      .view { padding: 0; }
      .modal-backdrop { position: static; background: none; display: block; padding: 0; }
      .modal { box-shadow: none; border-radius: 0; max-height: none; overflow: visible; max-width: none; }
      .panel, .kpi, .chart-box { border-color: #ccc; break-inside: avoid; }
      a[href]::after { content: ""; }
    }

    /* ---------- responsive ---------- */
    @media (max-width: 899px) {
      .sidebar {
        position: fixed; inset: 0 auto 0 0; z-index: 50; transform: translateX(-100%);
        transition: transform .18s ease; box-shadow: 0 0 40px rgba(0,0,0,.25); height: 100%;
      }
      .sidebar.open { transform: none; }
      .sidebar-backdrop { position: fixed; inset: 0; background: rgba(8,15,26,.5); z-index: 45; border: 0; }
      .desktop-only { display: none !important; }
      .bottom-bar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
        display: flex; gap: 8px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
        background: var(--surface); border-top: 1px solid var(--line);
      }
      .bottom-bar .btn { flex: 1; }
      .modal-backdrop { align-items: end; }
    }
    @media (min-width: 900px) {
      .mobile-only { display: none !important; }
      .bottom-bar { display: none; }
      .kpi-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .charts { grid-template-columns: 1fr 1fr; }
      .form-grid.two { grid-template-columns: 1fr 1fr; }
      .form-grid.three { grid-template-columns: repeat(3, 1fr); }
      .view { padding: 24px 28px 40px; }
      .modal-backdrop { place-items: center; padding: 24px; }
      .modal { border-radius: 18px; max-height: 88vh; }
      .cards-list { grid-template-columns: 1fr; }
      .table-only-mobile { display: none; }
    }
    @media (max-width: 899px) { .table-only-desktop { display: none; } }
  </style>
</head>
<body class="admin">
  <!-- ============ login ============ -->
  <div id="login-view" class="login-wrap">
    <div class="card login-card">
      <p class="eyebrow" id="login-brand">Staff area</p>
      <h1 id="login-title">Sign in</h1>
      <p class="muted small">Enter the staff PIN. Staff get check-in, members and payments; admins get everything.</p>
      <form id="login-form" class="form" novalidate>
        <div class="field">
          <label for="pin">PIN</label>
          <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password"
                 class="pin-input" maxlength="64" required />
          <p class="field-error" data-error-for="pin" hidden></p>
        </div>
        <button id="login-btn" class="btn btn-primary btn-block" type="submit">Sign in</button>
        <p class="form-error" id="login-error" role="alert" hidden></p>
      </form>
      <p class="small muted" style="margin-top:14px"><a href="/">← Back to the gym page</a></p>
    </div>
  </div>

  <!-- ============ app ============ -->
  <div id="app-view" class="app" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Sections">
      <div class="brand">
        <img id="side-logo" class="brand-logo" src="/og-image.png" alt="" width="32" height="32" />
        <span id="side-name">Gym</span>
      </div>
      <button class="nav-btn" data-view="dashboard"><span class="nav-icon" aria-hidden="true">▦</span>Dashboard</button>
      <button class="nav-btn" data-view="members"><span class="nav-icon" aria-hidden="true">☰</span>Members</button>
      <button class="nav-btn" data-view="checkin"><span class="nav-icon" aria-hidden="true">✓</span>Check-in</button>
      <button class="nav-btn" data-view="payments"><span class="nav-icon" aria-hidden="true">$</span>Payments</button>
      <button class="nav-btn" data-view="plans"><span class="nav-icon" aria-hidden="true">▤</span>Plans</button>
      <button class="nav-btn" data-view="inquiries"><span class="nav-icon" aria-hidden="true">✉</span>Inquiries</button>
      <button class="nav-btn" data-view="reports"><span class="nav-icon" aria-hidden="true">◔</span>Reports</button>
      <button class="nav-btn" data-view="settings"><span class="nav-icon" aria-hidden="true">⚙</span>Settings</button>
      <div class="sidebar-foot">
        <p class="small muted" id="side-role" style="margin:0 6px 8px">Signed in</p>
        <button class="nav-btn" id="logout-btn"><span class="nav-icon" aria-hidden="true">⏻</span>Sign out</button>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menu-btn" aria-label="Open menu" aria-expanded="false">☰</button>
        <h2 id="topbar-title">Dashboard</h2>
        <div class="topbar-spacer"></div>
        <button class="icon-btn" id="theme-btn" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
      </header>

      <main class="view" id="view-root" tabindex="-1"></main>

      <div class="bottom-bar mobile-only">
        <button class="btn btn-primary" id="bar-checkin">Check in</button>
        <button class="btn btn-ghost" id="bar-member">Add member</button>
      </div>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="false"></div>

  <!-- Chart.js pinned to an exact version so an upstream release cannot break the dashboard. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="/config.js"></script>
  <script>
  /* =====================================================================
     admin.html - staff dashboard logic
     Nothing here is trusted: the server re-checks the session and role on
     every single action. Hiding a button is only a convenience.
     ===================================================================== */
  (function () {
    'use strict';

    var API = (window.GYM_CONFIG && window.GYM_CONFIG.API_URL) || '';
    var configured = API && API.indexOf('PASTE_') !== 0;

    var state = {
      token: localStorage.getItem('gym_token') || '',
      role: '',
      gym: {},
      settings: {},
      view: 'dashboard',
      charts: {},
      members: { q: '', filter: 'all', page: 1, cache: null },
      payments: { from: '', to: '', q: '', page: 1 },
      reports: { from: '', to: '' }
    };

    /* ---------------- tiny DOM helpers ---------------- */
    function $(sel, root) { return (root || document).querySelector(sel); }
    function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
    function el(id) { return document.getElementById(id); }

    function h(tag, props) {
      var node = document.createElement(tag);
      if (props) {
        Object.keys(props).forEach(function (k) {
          var v = props[k];
          if (v === null || v === undefined || v === false) return;
          if (k === 'class') node.className = v;
          else if (k === 'text') node.textContent = v;
          else if (k === 'dataset') Object.keys(v).forEach(function (d) { node.dataset[d] = v[d]; });
          else if (k.slice(0, 2) === 'on' && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
          else if (k === 'checked' || k === 'disabled' || k === 'selected' || k === 'hidden') node[k] = !!v;
          else node.setAttribute(k, v);
        });
      }
      for (var i = 2; i < arguments.length; i++) {
        var child = arguments[i];
        if (Array.isArray(child)) {
          child.forEach(function (c) { if (c !== null && c !== undefined && c !== false) node.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c); });
        } else if (child !== null && child !== undefined && child !== false) {
          node.appendChild(typeof child === 'string' || typeof child === 'number' ? document.createTextNode(String(child)) : child);
        }
      }
      return node;
    }

    function clear(node) { while (node && node.firstChild) node.removeChild(node.firstChild); }

    function money(amount) {
      var sym = state.gym.currency_symbol || '$';
      var n = Number(amount) || 0;
      return sym + n.toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
    }

    function dateLabel(str) {
      if (!str) return '—';
      var p = String(str).slice(0, 10).split('-');
      if (p.length !== 3) return str;
      var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
      return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function todayISO() {
      var d = new Date();
      var m = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      return d.getFullYear() + '-' + m + '-' + day;
    }

    function daysAgoISO(n) {
      var d = new Date();
      d.setDate(d.getDate() - n);
      var m = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      return d.getFullYear() + '-' + m + '-' + day;
    }

    function statusBadge(status) {
      var map = {
        'Active': 'active', 'Expiring Soon': 'expiring', 'Expired': 'expired',
        'Frozen': 'frozen', 'Not Started': 'notstarted', 'No Membership': 'expired',
        'Inactive': 'expired'
      };
      return h('span', { class: 'badge ' + (map[status] || ''), text: status || '—' });
    }

    /* ---------------- api ---------------- */
    async function api(action, payload) {
      if (!configured) throw new Error('This dashboard is not connected yet. Add the Apps Script URL to config.js.');
      var body = { action: action, payload: payload || {} };
      if (state.token) body.token = state.token;
      var res;
      try {
        res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(body),
          redirect: 'follow'
        });
      } catch (netErr) {
        throw new Error("Can't reach the server. Check your connection and try again.");
      }
      var data = null;
      try { data = await res.json(); } catch (parseErr) { data = null; }
      if (!data) throw new Error('The server sent an unexpected response. Try again.');
      if (!data.ok) {
        var err = new Error((data.error && data.error.message) || 'Request failed.');
        err.code = data.error && data.error.code;
        if (err.code === 'AUTH' || err.code === 'FORBIDDEN' && !state.role) signOut(true);
        throw err;
      }
      return data.data;
    }

    /* ---------------- toast / modal ---------------- */
    function toast(message, kind) {
      var root = el('toast-root');
      var node = h('div', { class: 'toast ' + (kind || ''), text: message, role: 'status' });
      root.appendChild(node);
      setTimeout(function () {
        node.style.opacity = '0';
        node.style.transition = 'opacity .2s';
        setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 220);
      }, kind === 'error' ? 5200 : 3200);
    }

    function closeModal() {
      var root = el('modal-root');
      clear(root);
    }

    function openModal(title, bodyNode, options) {
      var opts = options || {};
      var root = el('modal-root');
      clear(root);

      var closeBtn = h('button', { class: 'icon-btn', 'aria-label': 'Close', type: 'button', text: '✕', onclick: closeModal });
      var head = h('div', { class: 'modal-head' }, h('h2', { text: title }), closeBtn);
      var modal = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title });

      modal.appendChild(head);
      modal.appendChild(bodyNode);
      if (opts.footer) modal.appendChild(opts.footer);

      var backdrop = h('div', { class: 'modal-backdrop', onclick: function (e) { if (e.target === backdrop) closeModal(); } }, modal);
      root.appendChild(backdrop);

      var focusable = modal.querySelector('input, textarea, select, button');
      if (focusable) setTimeout(function () { focusable.focus(); }, 40);

      backdrop.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeModal();
        if (e.key === 'Tab') {
          var nodes = $all('button, input, select, textarea, a[href]', modal).filter(function (n) { return !n.disabled; });
          if (!nodes.length) return;
          var first = nodes[0], last = nodes[nodes.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      });
      return modal;
    }

        var errNode = $('[data-error-for="pin"]');
        var status = el('login-error');
        var btn = el('login-btn');
        var pin = pinInput.value.trim();
        errNode.hidden = true;
        status.hidden = true;
        status.textContent = '';

        if (!pin || pin.length < 4) {
          errNode.textContent = 'Enter your PIN (at least 4 characters).';
          errNode.hidden = false;
          pinInput.focus();
          return;
        }
        btn.disabled = true;

        try {

          status.textContent = err.message;

    function exportCsv(type, from, to) {
      api('export_data', { type: type, from: from || '', to: to || '' }).then(function (res) {
        var blob = new Blob(['\ufeff' + res.csv], { type: 'text/csv;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = h('a', { href: url, download: res.filename });
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
        toast('Export ready: ' + res.filename, 'ok');
      }).catch(function (err) { toast(err.message, 'error'); });
    }

      $('#s-template_expired', form).value = s.template_expired || '';
      $('#s-template_payment_due', form).value = s.template_payment_due || '';

      ['gym_name', 'currency_symbol', 'contact_phone', 'contact_email', 'expiry_warning_days', 'checkin_window_minutes', 'theme_default', 'contact_address', 'opening_hours', 'logo_url', 'facebook_url', 'receipt_footer', 'reminder_email_to', 'reminder_days', 'template_expiring', 'template_expired', 'template_payment_due'].forEach(function (key) {
        var node = $('#s-' + key, form);
        if (!node) return;
        node.addEventListener('input', function () { node.dataset.touched = '1'; });
      });

      $('#save-settings', form).addEventListener('click', async function (e) {
        var btn = e.currentTarget;
        var errNode = el('settings-error');
        errNode.hidden = true;
        btn.disabled = true;
        btn.textContent = 'Saving…';
        var payload = {};
        ['gym_name', 'currency_symbol', 'contact_phone', 'contact_email', 'expiry_warning_days', 'checkin_window_minutes', 'theme_default', 'contact_address', 'opening_hours', 'logo_url', 'facebook_url', 'receipt_footer', 'reminder_email_to', 'reminder_days', 'template_expiring', 'template_expired', 'template_payment_due'].forEach(function (key) {
          var node = $('#s-' + key, form);
          if (node) payload[key] = node.value.trim();
        });
        try {
          var res = await api('settings_save', { settings: payload });
          state.settings = res.settings || state.settings;
          state.gym = Object.assign({}, state.gym, res.public || {});
          el('side-name').textContent = state.gym.gym_name || 'Gym';
          toast('Settings saved.', 'ok');
        } catch (err) {
          errNode.textContent = err.message;
          errNode.hidden = false;
        } finally {
          btn.disabled = false;
          btn.textContent = 'Save settings';
        }
      });

      root.appendChild(h('section', { class: 'panel' }, h('div', { class: 'panel-head' }, h('h2', { text: 'Gym details' })), form));

      /* PIN change */
      var pinForm = h('div', { class: 'form-grid two' },
        field('Current PIN', h('input', { id: 'pin-current', type: 'password', autocomplete: 'current-password', maxlength: 64 })),
        field('New PIN', h('input', { id: 'pin-new', type: 'password', autocomplete: 'new-password', maxlength: 64 }), '6–64 characters. Changing it signs everyone out.')
      );
      var pinBtn = h('button', { class: 'btn btn-primary', type: 'button', text: 'Change admin PIN' });
      var pinError = h('p', { class: 'form-error', hidden: true });
      pinBtn.addEventListener('click', async function () {
        pinError.hidden = true;
        pinBtn.disabled = true;
        try {
          await api('pin_change', { current_pin: el('pin-current').value, new_pin: el('pin-new').value });
          toast('PIN changed. Please sign in again.', 'ok');
          signOut(true);
        } catch (err) {
          pinError.textContent = err.message;
          pinError.hidden = false;
        } finally {
          pinBtn.disabled = false;
        }
      });
      root.appendChild(h('section', { class: 'panel' }, h('div', { class: 'panel-head' }, h('h2', { text: 'Security' })),
        pinForm, h('div', { class: 'toolbar', style: 'margin-top:12px' }, pinBtn), pinError));

      /* Data tools */
      var backupBtn = h('button', { class: 'btn btn-ghost', type: 'button', text: 'Back up now' });
      backupBtn.addEventListener('click', async function () {
        backupBtn.disabled = true;
        backupBtn.textContent = 'Backing up…';
        try {
          var res = await api('backup_run', {});
          toast('Backup created: ' + res.name, 'ok');
        } catch (err) {
          toast(err.message, 'error');
        } finally {
          backupBtn.disabled = false;
          backupBtn.textContent = 'Back up now';
        }
      });

      var clearBtn = h('button', { class: 'btn btn-ghost', type: 'button', text: 'Clear sample data' });
      clearBtn.addEventListener('click', async function () {
        var ok = await confirmDialog('Clear sample data', 'Remove the sample members, plans, payments and check-ins that ship with setup? Your own data is not touched.', 'Clear sample data');
        if (!ok) return;
        try {
          var res = await api('sample_clear', {});
          toast('Removed ' + res.members + ' sample members and ' + res.plans + ' sample plans.', 'ok');
        } catch (err) {
          toast(err.message, 'error');
        }
      });

      root.appendChild(h('section', { class: 'panel' }, h('div', { class: 'panel-head' }, h('h2', { text: 'Data tools' })),
        h('p', { class: 'small muted', text: 'A weekly backup copy is saved to Google Drive in the Gym Tracker Backups folder.' }),
        h('div', { class: 'toolbar' }, backupBtn, clearBtn)));

      root.appendChild(importPanel());
    }

    function importPanel() {
      var area = h('textarea', { id: 'import-csv', rows: 6, placeholder: 'full_name,phone,email,address,notes,date_joined\nJane Doe,07700900123,jane@example.com,12 High St,Paid in cash,2026-01-15' });
      var previewBox = h('div', { style: 'margin-top:12px' });
      var previewBtn = h('button', { class: 'btn btn-ghost', type: 'button', text: 'Preview import' });
      var commitBtn = h('button', { class: 'btn btn-primary', type: 'button', text: 'Import valid rows', disabled: true });
      var staged = [];

      previewBtn.addEventListener('click', async function () {
        previewBox.textContent = '';
        previewBox.appendChild(skeletonList(2));
        try {
          var res = await api('import_preview', { csv: area.value });
          staged = res.rows.filter(function (r) { return r.ok; });
          previewBox.textContent = '';
          previewBox.appendChild(h('p', { class: 'small muted', text: res.valid_count + ' ready · ' + res.invalid_count + ' with problems' + (res.truncated ? ' (first 500 rows only)' : '') }));
          var table = h('table', {},
            h('thead', {}, h('tr', {}, h('th', { text: 'Row' }), h('th', { text: 'Name' }), h('th', { text: 'Phone / email' }), h('th', { text: 'Problems' }))),
            h('tbody', {}, res.rows.slice(0, 100).map(function (r) {
              return h('tr', {},
                h('td', { text: r.row }),
                h('td', { text: r.values.full_name || '' }),
                h('td', { class: 'small', text: (r.values.phone || '') + ' ' + (r.values.email || '') }),
                h('td', { class: 'small', text: r.errors.length ? r.errors.join(' ') : 'OK' })
              );
            }))
          );
          previewBox.appendChild(h('div', { class: 'table-wrap' }, table));
          commitBtn.disabled = staged.length === 0;
        } catch (err) {
          previewBox.textContent = '';
          previewBox.appendChild(h('p', { class: 'form-error', text: err.message }));
          commitBtn.disabled = true;
        }
      });

      commitBtn.addEventListener('click', async function () {
        commitBtn.disabled = true;
        commitBtn.textContent = 'Importing…';
        try {
          var res = await api('import_commit', { rows: staged });
          toast('Imported ' + res.created + ' members, skipped ' + res.skipped + '.', 'ok');
          area.value = '';
          previewBox.textContent = '';
          staged = [];
        } catch (err) {
          toast(err.message, 'error');
          commitBtn.disabled = false;
        } finally {
          commitBtn.textContent = 'Import valid rows';
        }
      });

      return h('section', { class: 'panel' }, h('div', { class: 'panel-head' }, h('h2', { text: 'Import members from CSV' })),
        h('p', { class: 'small muted', text: 'Columns: full_name (required), phone, email, address, notes, date_joined (YYYY-MM-DD), emergency_name, emergency_phone. Nothing is written until you preview and confirm.' }),
        h('div', { class: 'field' }, area),
        h('div', { class: 'toolbar' }, previewBtn, commitBtn),
        previewBox);
    }

    /* =================================================================
       INQUIRIES
       ================================================================= */
    async function viewInquiries() {
      setLoading('Inquiries');
      var root = el('view-root');
      var listBox = h('div', {}, skeletonList(4));
      clear(root);
      root.appendChild(h('div', { class: 'view-head' }, h('h1', { text: 'Inquiries' }),
        h('span', { class: 'small muted', text: 'From the public join form' })));
      root.appendChild(listBox);

      try {
        var data = await api('inquiries_list', {});
        clear(listBox);
        if (!data.items.length) {
          listBox.appendChild(emptyState('No inquiries yet', 'Messages from the website join form appear here.'));
          return;
        }
        var list = h('div', { class: 'cards-list' });
        data.items.forEach(function (q) {
          var row = h('div', { class: 'member-card' },
            h('div', { class: 'member-card-top' },
              h('strong', { text: q.full_name }),
              h('span', { class: 'badge ' + (q.status === 'new' ? 'expiring' : q.status === 'contacted' ? 'frozen' : 'active'), text: q.status })
            ),
            h('div', { class: 'member-meta' },
              h('span', { text: q.phone || 'no phone' }),
              h('span', { text: q.email || 'no email' }),
              h('span', { text: dateLabel(q.created_at) })
            ),
            q.message ? h('p', { class: 'small', style: 'margin:6px 0 0', text: q.message }) : null
          );
          var actions = h('div', { class: 'row-actions', style: 'margin-top:8px' });
          if (q.phone) actions.appendChild(h('a', { class: 'btn btn-ghost btn-sm', href: 'tel:' + q.phone.replace(/[^\d+]/g, ''), text: 'Call' }));
          if (q.email) actions.appendChild(h('a', { class: 'btn btn-ghost btn-sm', href: 'mailto:' + q.email, text: 'Email' }));
          ['contacted', 'closed'].forEach(function (status) {
            if (q.status === status) return;
            actions.appendChild(h('button', {
              class: 'btn btn-ghost btn-sm', type: 'button', text: 'Mark ' + status,
              onclick: async function () {
                try {
                  await api('inquiry_status', { inquiry_id: q.inquiry_id, status: status });
                  toast('Inquiry marked ' + status + '.', 'ok');
                  viewInquiries();
                } catch (err) { toast(err.message, 'error'); }
              }
            }));
          });
          row.appendChild(actions);
          list.appendChild(row);
        });
        listBox.appendChild(list);
      } catch (err) {
        clear(listBox);
        listBox.appendChild(h('p', { class: 'form-error', text: err.message }));
      }
    }

    /* =================================================================
       BOOT
       ================================================================= */
    function bindShell() {
      $all('.nav-btn[data-view]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          closeSidebar();
          setView(btn.dataset.view);
        });
      });

      el('logout-btn').addEventListener('click', function () { signOut(); });

      el('theme-btn').addEventListener('click', function () {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        if (state.view === 'dashboard') viewDashboard();
        else if (state.view === 'reports') viewReports();
      });

      el('bar-checkin').addEventListener('click', function () { setView('checkin'); });
      el('bar-member').addEventListener('click', function () { openMemberForm(null); });

      el('menu-btn').addEventListener('click', function () {
        var sidebar = el('sidebar');
        var isOpen = sidebar.classList.toggle('open');
        el('menu-btn').setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        if (isOpen) {
          var back = h('button', { class: 'sidebar-backdrop', 'aria-label': 'Close menu', onclick: closeSidebar });
          back.id = 'sidebar-backdrop';
          document.body.appendChild(back);
        }
      });
    }

    function closeSidebar() {
      el('sidebar').classList.remove('open');
      el('menu-btn').setAttribute('aria-expanded', 'false');
      var back = el('sidebar-backdrop');
      if (back) back.parentNode.removeChild(back);
    }

    async function boot() {
      applyTheme(localStorage.getItem('gym_theme') || 'light');
      bindLogin();
      bindShell();

      if (!configured) {
        el('login-error').textContent = 'This dashboard is not connected yet. Add your Apps Script web app URL to config.js, then reload.';
        el('login-error').hidden = false;
        return;
      }

      if (!state.token) return;
      try {
        var session = await api('session', {});
        state.role = session.role;
        state.gym = session.gym || {};
        el('login-view').hidden = true;
        el('login-view').style.display = 'none';
        el('app-view').hidden = false;
        el('side-role').textContent = 'Signed in as ' + session.role;
        el('side-name').textContent = state.gym.gym_name || 'Gym';
        if (state.gym.logo_url) el('side-logo').src = state.gym.logo_url;
        try {
          var data = await api('settings_get', {});
          state.settings = (data && data.settings) || {};
          state.gym = Object.assign({}, state.gym, (data && data.public) || {});
        } catch (e) {}
        setView('dashboard');
      } catch (err) {
        signOut(true);
      }
    }

    boot();
  })();
  </script>
</body>
</html>
